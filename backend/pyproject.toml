[project]
name = "graphrag-backend"
version = "0.1.0"
description = "Graph-augmented multimodal company-knowledge QA backend"
requires-python = ">=3.12"
dependencies = [
    "exa-py==2.20.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain==0.3.30",
    "langchain-community==0.3.22",
    "langchain-core==0.3.86",
    "langchain-openai==0.3.35",
    "neo4j==6.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "qdrant-client==1.19.0",
    "ragas==0.4.3",
    "sarvamai==0.1.33",
    "streamlit==1.63.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pyrefly==1.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]
gpu = [
    "docling==2.126.0",
    "flagembedding==1.4.2",
    "torch==2.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that call live external services",
]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["."]
disable-search-path-heuristics = true
python-version = "3.12"
